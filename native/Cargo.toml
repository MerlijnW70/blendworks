[package]
name = "blendworks_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"
publish = false

[lib]
name = "blendworks_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
debug = false
panic = "unwind"
codegen-units = 1
lto = true
